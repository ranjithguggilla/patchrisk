[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchrisk"
version = "0.1.0"
description = "Rank code changes by the chance they introduce a bug, validated forward in time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "scipy>=1.13", "matplotlib>=3.8",
  "joblib>=1.4", "pydriller>=2.7", "radon>=6.0", "gitpython>=3.1", "gradio>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
patchrisk = "patchrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E741", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
